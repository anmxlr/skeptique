name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          node scripts/commit-msg.mjs --range "$range"
      - run: pnpm lint
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Local review flow
        run: pnpm e2e
        env:
          DEV2_EVIDENCE_PATH: ${{ runner.temp }}/skeptique-flow.json
      - name: Local round settlement
        run: pnpm settle:local
        env:
          DEV2_EVIDENCE_PATH: ${{ runner.temp }}/skeptique-flow.json
          DEV2_SETTLEMENT_PATH: ${{ runner.temp }}/skeptique-settlement.json
      - name: Repeatable seed and fixture drills
        run: |
          pnpm seed
          pnpm seed
          pnpm drills
